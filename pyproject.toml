[project]
name = "remy"
version = "0.1.0"
description = "Remy - Meal and Recipe Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx2>=2.9.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.2.10",
    "langsmith>=0.10.17",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "ollama>=0.6.2",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.poe.tasks]
clobber = "rm -rf .venv/ dist/ site/"
docker = "docker build -t remy:latest ."
test = "pytest"

[tool.poe.tasks.clean]
help = "Clean up cruft"
default_item_type = "cmd"
sequence = [
    "rm -rf .ruff_cache/ .coverage coverage.xml .pytest_cache",
    "find . -type f -name '*.py[co]' -delete -type d -name __pycache__ -delete",
]

[tool.poe.tasks.fmt]
help = "Format Python code with Ruff"
default_item_type = "cmd"
sequence = [
    "ruff format",
    "ruff check --fix",
]

[tool.poe.tasks.lint]
help = "Lint code with Ruff, type checks with Pyrefly"
default_item_type = "cmd"
sequence = [
    "ruff format --check",
    "ruff check",
    "pyrefly check",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
